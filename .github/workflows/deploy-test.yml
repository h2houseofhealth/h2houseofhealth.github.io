name: Deploy Test Branch

on:
  push:
    branches:
      - test

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::881953411973:role/github-actions-h2-deploy
          aws-region: ap-south-1

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-07aebb51afb24f8e2 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["export HOME=/root","cd /opt/h2house && git fetch origin test && git reset --hard origin/test && npm install --production && sudo systemctl restart h2-booking"]' \
            --query "Command.CommandId" \
            --output text)
          
          echo "Command ID: $COMMAND_ID"
          
          # Wait for command to complete
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-07aebb51afb24f8e2 \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            if [ "$STATUS" = "Success" ]; then
              echo "Deploy succeeded!"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deploy failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-07aebb51afb24f8e2 \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            
            echo "Status: $STATUS - waiting..."
            sleep 10
          done
          
          echo "Timed out waiting for deploy"
          exit 1
