name: Deploy Production Branch

on:
  push:
    branches:
      - prd

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::881953411973:role/github-actions-h2-deploy
          aws-region: ap-south-1

      # Deploys on the server, then checks http://127.0.0.1:3002/api/health.
      # If the new version is not healthy, resets to the previously deployed
      # commit, restarts, and fails this job so the failure is visible.
      - name: Deploy to EC2 via SSM (with health gate and rollback)
        run: |
          cat > deploy.sh <<'SCRIPT'
          export HOME=/root
          cd /opt/h2house-prd

          healthy() {
            for i in $(seq 1 15); do
              code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://127.0.0.1:3002/api/health)
              [ "$code" = "200" ] && return 0
              sleep 3
            done
            return 1
          }

          PREV=$(git rev-parse HEAD)
          echo "Previous commit: $PREV"

          git fetch origin prd && git reset --hard origin/prd \
            && npm install --omit=dev \
            && systemctl restart h2-booking-prd
          DEPLOY_RC=$?
          NEW=$(git rev-parse HEAD)
          echo "Deployed commit: $NEW (deploy exit code $DEPLOY_RC)"

          if [ "$DEPLOY_RC" = "0" ] && healthy; then
            echo "HEALTH GATE PASSED"
            exit 0
          fi

          echo "HEALTH GATE FAILED - rolling back to $PREV"
          journalctl -u h2-booking-prd -n 15 --no-pager | cut -c1-200
          git reset --hard "$PREV" && npm install --omit=dev && systemctl restart h2-booking-prd
          if healthy; then
            echo "ROLLED BACK to $PREV and healthy"
          else
            echo "ROLLBACK ALSO UNHEALTHY - manual intervention needed"
          fi
          exit 1
          SCRIPT

          PARAMS=$(jq -n --rawfile s deploy.sh '{commands: ($s | split("\n"))}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-07aebb51afb24f8e2 \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          sleep 5

          for i in $(seq 1 40); do
            RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-07aebb51afb24f8e2 \
              --output json 2>&1) || true

            STATUS=$(echo "$RESULT" | jq -r '.Status // "Pending"' 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success)
                echo "$RESULT" | jq -r '.StandardOutputContent // ""'
                echo "Deploy succeeded and passed the health gate!"
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy FAILED: $STATUS"
                echo "$RESULT" | jq -r '.StandardOutputContent // ""'
                echo "$RESULT" | jq -r '.StandardErrorContent // ""'
                exit 1
                ;;
              *)
                echo "Status: $STATUS - waiting... ($i/40)"
                sleep 10
                ;;
            esac
          done

          echo "Timed out waiting for deploy"
          exit 1

      - name: Verify public site health
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' https://h2houseofhealth.com/api/health)
            echo "Public health check: $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "Public site is not healthy"
          exit 1
