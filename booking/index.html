<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House Bookings – Coming Soon | H2 House of Health</title>
    <link rel="icon" type="image/png" href="assets/brand/H2_icon.png" />
    <link rel="stylesheet" href="../site-background.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f9f9f9;
        color: #3f3f3f;
        text-align: center;
        padding: 2rem;
      }
      .coming-soon {
        max-width: 560px;
      }
      .coming-soon__logo {
        width: 120px;
        margin-bottom: 2rem;
      }
      .coming-soon__badge {
        display: inline-block;
        background: #ae5431;
        color: #fff;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        padding: 0.4rem 1rem;
        border-radius: 100px;
        margin-bottom: 1.5rem;
      }
      .coming-soon__title {
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 500;
        line-height: 1.1;
        margin-bottom: 1rem;
      }
      .coming-soon__desc {
        font-size: 1.1rem;
        line-height: 1.6;
        color: #6d6d6d;
        margin-bottom: 2rem;
      }
      .coming-soon__back {
        display: inline-block;
        background: #3f3f3f;
        color: #fff;
        text-decoration: none;
        font-family: "Roboto Mono", monospace;
        font-size: 0.85rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.9rem 2rem;
        border-radius: 100px;
        transition: background 0.2s;
      }
      .coming-soon__back:hover {
        background: #272724;
      }
    </style>
  </head>
  <body>
    <div class="coming-soon">
      <img src="assets/brand/H2_Logo.png" alt="H2 House of Health" class="coming-soon__logo" />
      <span class="coming-soon__badge">Coming Soon</span>
      <h1 class="coming-soon__title">House Bookings</h1>
      <p class="coming-soon__desc">
        We're putting the finishing touches on our booking experience. 
        Soon you'll be able to book hydrogen sessions, IV therapies, and explore membership plans — all in one place.
      </p>
      <a href="/" class="coming-soon__back">Back to House of Health</a>
    </div>
  </body>
</html>
