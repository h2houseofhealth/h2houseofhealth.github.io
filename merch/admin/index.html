<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="api-base-url" content="" />
    <title>House Merch Admin - H2 House of Health</title>
    <meta
      name="description"
      content="House Merch Admin Dashboard for products, orders, customers, coupons, influencers, reports, and store settings."
    />
    <link rel="icon" type="image/png" href="/booking/assets/brand/H2_icon.png" />
    <link rel="stylesheet" href="/booking/styles.css" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="merch-page merch-admin-page">
    <div class="admin-shell">
      <aside class="admin-sidebar" id="adminSidebar" aria-label="Admin navigation">
        <div class="admin-sidebar__brand">
          <a class="admin-brand" href="/merch/" aria-label="House of Health merch store">
            <img src="/cdn/shop/files/H2_Logo9664.png?v=1767874858&width=144" alt="House of Health" width="144" height="54" />
          </a>
        </div>

        <div class="admin-sidebar__meta">
          <p class="admin-kicker">House Merch Admin</p>
          <strong>Merchandise control center</strong>
        </div>

        <nav class="admin-nav" aria-label="Sections">
          <button class="admin-nav__item is-active" type="button" data-nav-view="dashboard">Dashboard</button>
          <button class="admin-nav__item" type="button" data-nav-view="products">Products</button>
          <button class="admin-nav__item" type="button" data-nav-view="orders">Orders</button>
          <button class="admin-nav__item" type="button" data-nav-view="customers">Customers</button>
          <button class="admin-nav__item" type="button" data-nav-view="coupons">Coupons</button>
          <button class="admin-nav__item" type="button" data-nav-view="influencers">Influencers</button>
          <button class="admin-nav__item" type="button" data-nav-view="reports">Reports</button>
          <button class="admin-nav__item" type="button" data-nav-view="settings">Settings</button>
          <button class="admin-nav__item admin-nav__item--danger" type="button" data-action="logout">Logout</button>
        </nav>
      </aside>

      <div class="admin-overlay" id="sidebarOverlay" hidden></div>

      <div class="admin-main">
        <header class="admin-topbar">
          <div class="admin-topbar__left">
            <button class="admin-icon-btn admin-topbar__menu" id="sidebarOpenBtn" type="button" aria-label="Open navigation">
              <span></span>
              <span></span>
              <span></span>
            </button>
            <div>
              <p class="admin-kicker">House Merch</p>
              <h1 id="pageTitle">Dashboard</h1>
            </div>
          </div>

          <div class="admin-topbar__right">
            <div class="admin-pill" aria-label="Unread notifications">
              <span class="admin-pill__dot"></span>
              <span aria-hidden="true">&#128276;</span>
              <span id="notificationBadgeCount">0</span>
            </div>
            <button class="admin-profile" type="button" data-action="open-profile" aria-label="Open admin profile">
              <span class="admin-profile__avatar" id="profileAvatar">AH</span>
              <span class="admin-profile__meta">
                <strong>Admin House</strong>
                <small>admin@h2health.local</small>
              </span>
            </button>
          </div>
        </header>

        <main class="admin-content" id="adminContent">
          <section class="admin-view is-active" data-view="dashboard" id="dashboardView"></section>
          <section class="admin-view" data-view="products" id="productsView"></section>
          <section class="admin-view" data-view="categories" id="categoriesView"></section>
          <section class="admin-view" data-view="orders" id="ordersView"></section>
          <section class="admin-view" data-view="customers" id="customersView"></section>
          <section class="admin-view" data-view="coupons" id="couponsView"></section>
          <section class="admin-view" data-view="influencers" id="influencersView"></section>
          <section class="admin-view" data-view="reports" id="reportsView"></section>
          <section class="admin-view" data-view="settings" id="settingsView"></section>
        </main>
      </div>
    </div>

    <div class="admin-modal" id="adminModal" hidden aria-hidden="true">
      <div class="admin-modal__backdrop" data-action="close-modal"></div>
      <div class="admin-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="adminModalTitle" id="adminModalDialog"></div>
    </div>

    <div class="admin-toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

    <script src="admin.js"></script>
  </body>
</html>
